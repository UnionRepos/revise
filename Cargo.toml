[package]
name = "revise"
version = "0.1.0"
edition = "2021"
description = "Magnificent app which corrects your previous console command"
license = "MIT"
publish = false

[[bin]]
name = "revise"
path = "src/main.rs"

[dependencies]
fancy-regex = "0.14"
serde = { version = "1", features = ["derive"] }
serde_json = "1"
libc = "0.2"
vt100 = "0.15"
zip = "2"
tar = "0.4"
